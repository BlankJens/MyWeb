version: "3.7"

services:
 app:
  build: .
  ports:
   - "8080:8080"
  depends_on:
   mysql:
    condition: service_healthy
  networks:
   - my-network
 mysql:
  image: mysql:latest
  environment:
   MYSQL_ROOT_PASSWORD: root
   MYSQL_USER: usr
   MYSQL_PASSWORD: 1234
   MYSQL_DATABASE: myweb
  ports:
   - 3307:3306
  healthcheck:
   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
   interval: 5s
   timeout: 5s
   retries: 10
  networks:
   - my-network
  volumes:
   - myweb-data:/var/lib/mysql

networks:
 my-network:
  driver: bridge

volumes:
 myweb-data: