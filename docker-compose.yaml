version: "3.7"

services:
 app:
  build: .
  ports:
   - "8080:8080"
  environment:
   # NAO fixe DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD aqui. Literais neste
   # bloco sobrescrevem as variaveis injetadas pelo ambiente de deploy e fazem
   # a app tentar conectar num host "mysql" que nao existe la. Os defaults
   # estao em src/main/resources/application.properties.
   #
   # ":?" faz o docker compose abortar na hora com mensagem clara,
   # em vez de a aplicacao subir e quebrar por placeholder nao resolvido.
   CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?defina CLOUDINARY_CLOUD_NAME no .env}
   CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?defina CLOUDINARY_API_KEY no .env}
   CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?defina CLOUDINARY_API_SECRET no .env}
   # Opcional: upload assinado nao exige preset. Deixe vazio para nao usar.
   CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
  depends_on:
   mysql:
    condition: service_healthy
  networks:
   - my-network
 mysql:
  image: mysql:latest
  environment:
   MYSQL_ROOT_PASSWORD: root
   MYSQL_USER: usr
   MYSQL_PASSWORD: 1234
   MYSQL_DATABASE: myweb
  ports:
   - 3307:3306
  healthcheck:
   test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
   interval: 5s
   timeout: 5s
   retries: 15
   # Sem start_period, um volume novo faz o MySQL demorar mais que os 50s de
   # retries e o primeiro deploy morre antes do banco ficar pronto.
   start_period: 40s
  networks:
   - my-network
  volumes:
   - myweb-data:/var/lib/mysql

networks:
 my-network:
  driver: bridge

volumes:
 myweb-data: