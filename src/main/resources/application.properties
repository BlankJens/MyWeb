spring.application.name=MyWeb
# Default local. No Render quem manda na porta e a variavel PORT, traduzida para
# server.port em MyWebApplication.main (o Spring mapeia SERVER_PORT, mas nao PORT).
spring.server.port=8080

# Nao fixe o driver: o Spring Boot detecta pelo esquema da URL. Assim o mesmo
# build funciona com MySQL e com PostgreSQL. Fixar "com.mysql.cj.jdbc.Driver"
# quebra se o banco for Postgres.
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No Render, defina JDBC_URL com a URL JDBC COMPLETA e valida.
# A connection string do Aiven vem como "mysql://user:senha@host:porta/db", e o
# Connector/J REJEITA esse formato ("No suitable driver found for mysql://...").
# Nao cole a connection string do Aiven direto: prefixe com "jdbc:mysql://" e
# acrescente sslMode=REQUIRED, porque o Aiven exige conexao com SSL.
#
# Precedencia: JDBC_URL > DATABASE_URL > DB_HOST/DB_PORT/DB_NAME.
# IMPORTANTE: use ":" e NAO ":-" no default. neste Spring o parser divide no
# primeiro ":" e "${DB_HOST:-mysql}" vira o host "-mysql" (quebrado).
spring.datasource.url=${JDBC_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:myweb}?autoReconnect=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USER:usr}
spring.datasource.password=${DB_PASSWORD:1234}
# Fixar o dialect tambem prende o build no MySQL. Sem esta linha o Hibernate 6
# detecta sozinho a partir da URL, e funciona nos dois bancos.
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limite de upload: o default do Spring e 1MB e rejeita fotos maiores com HTTP 413
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# O ":" no final torna o padrao opcional. Sem ele, a app nem sobe
# (PlaceholderResolutionException) quando a variavel de ambiente nao existe.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# Opcional: o upload assinado (com api_key/api_secret) nao exige preset.
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
