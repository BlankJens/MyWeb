spring.application.name=MyWeb
spring.server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Aceita uma URL completa (padrao de varias plataformas: DATABASE_URL / JDBC_URL).
# Sem ela, monta a URL a partir de DB_HOST/DB_PORT/DB_NAME, com defaults que
# batem com o servico mysql do docker-compose -- assim um "docker compose up"
# puro funciona, e qualquer variavel injetada pelo ambiente de deploy vence.
#
# IMPORTANTE: use ":" e NAO ":-" no default. neste Spring o parser divide no
# primeiro ":" e "${DB_HOST:-mysql}" vira o host "-mysql" (quebrado).
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:myweb}?autoReconnect=true&useSSL=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:usr}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limite de upload: o default do Spring e 1MB e rejeita fotos maiores com HTTP 413
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# O ":" no final torna o padrao opcional. Sem ele, a app nem sobe
# (PlaceholderResolutionException) quando a variavel de ambiente nao existe.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# Opcional: o upload assinado (com api_key/api_secret) nao exige preset.
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
